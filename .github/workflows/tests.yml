name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # One KLayout for the whole ecosystem. The source of truth is
  # `ARG KLAYOUT_PIP` in the adk-tools Dockerfile. Unpinned, this job would
  # resolve whatever wheel is newest on the day it runs, which is how the
  # ecosystem ended up with four notions of "the supported KLayout".
  KLAYOUT_VERSION: "0.30.5"

jobs:
  tests:
    # Pinned rather than ubuntu-latest: a runner image that rolls forward
    # under the project changes what a green run means without a commit.
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Without this the pip cache keys on nothing repository-specific, so
          # a dependency change reuses the previous run's wheels.
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest "klayout==${KLAYOUT_VERSION}" PyYAML

      - name: Run tests
        run: pytest tests -q

  # The one required status check. A single collector context per repository
  # means a ruleset names `ci-gate` everywhere and never has to be edited when
  # the job list inside a workflow changes.
  ci-gate:
    needs: [tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gating job to have succeeded
        # `needs` alone does not gate: with `if: always()` this job runs even
        # when a dependency failed, so the result has to be compared
        # explicitly. Without the comparison the gate reports green after its
        # dependencies went red.
        run: |
          echo "tests: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"
