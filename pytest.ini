[pytest]
# -ra prints the reason for every skipped test. The README already says 20 skips
# are expected because they need a sibling repo; this makes the log say which
# ones and why, so the twenty-first is visible the day it appears.
#
# --strict-markers and --strict-config turn a typo in a marker or an ini key
# into an error instead of a silently ignored line.
addopts = -ra --strict-markers --strict-config
testpaths = tests
